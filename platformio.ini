; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = local_settings.ini
default_envs = esp32dev

[env]
lib_deps =
	milesburton/DallasTemperature@3.11.0
	paulstoffregen/OneWire@2.3.7
	martin-laclaustra/CronAlarms@0.1.0
	m-tech-creations/NoDelay@2.2.0
	knolleary/PubSubClient@2.8
	tzapu/WiFiManager@2.0.17
	bblanchon/ArduinoJson@7.4.3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; requires a one-time USB flash to apply; preserved across subsequent OTA updates
board_build.partitions = min_spiffs.csv
build_flags =
  -DCORE_DEBUG_LEVEL=4
  -DAP_PASSWORD=\"${sysenv.ESP_AP_PASSWORD}\"
  -DOTA_PASSWORD=\"${sysenv.ESP_OTA_PASSWORD}\"

[env:native]
platform = native
test_framework = unity
build_flags =
  -I test/stubs
  -I test/mocks
  -I lib/commons
  -I lib/devices
  -std=c++17
build_src_filter = -<*>
lib_ignore = commons, fs, mqtt, logger

